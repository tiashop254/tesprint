name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize React Native App
        run: |
          npx react-native@latest init AplikasiPrinter --skip-install
          cd AplikasiPrinter
          npm install --legacy-peer-deps
          npm install https://github.com/tiasho/react-native-bluetooth-escpos-printer.git --save --legacy-peer-deps
          
          # Buat file App.tsx dengan kode printer
          cat << 'EOF' > App.tsx
          import React from 'react';
          import { SafeAreaView, StyleSheet, Text, TouchableOpacity, Alert } from 'react-native';
          import { BluetoothEscposPrinter } from 'react-native-bluetooth-escpos-printer';

          const App = () => {
            const handlePrint = async () => {
              try {
                await BluetoothEscposPrinter.printerAlign(BluetoothEscposPrinter.ALIGN.CENTER);
                await BluetoothEscposPrinter.printText("TES CETAK PRINTER\n\r", {
                  encoding: 'GBK',
                  codepage: 0,
                  widthtimes: 1,
                  heigthtimes: 1,
                });
                await BluetoothEscposPrinter.printText("--------------------------------\n\r", {});
                await BluetoothEscposPrinter.printText("Berhasil Terhubung!\n\r\n\r", {});
              } catch (error) {
                Alert.alert("Gagal Cetak", error.toString());
              }
            };

            return (
              <SafeAreaView style={styles.container}>
                <Text style={styles.title}>Aplikasi Printer Bluetooth</Text>
                <TouchableOpacity style={styles.button} onPress={handlePrint}>
                  <Text style={styles.buttonText}>Cetak Struk Tes</Text>
                </TouchableOpacity>
              </SafeAreaView>
            );
          };

          const styles = StyleSheet.create({
            container: { flex: 1, justifyContent: 'center', alignItems: 'center', backgroundColor: '#F5FCFF' },
            title: { fontSize: 20, fontWeight: 'bold', marginBottom: 20 },
            button: { backgroundColor: '#0284c7', paddingHorizontal: 20, paddingVertical: 12, borderRadius: 8 },
            buttonText: { color: '#ffffff', fontWeight: 'bold' }
          });

          export default App;
          EOF

      - name: Build Android APK
        run: |
          cd AplikasiPrinter/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: AplikasiPrinter/android/app/build/outputs/apk/debug/app-debug.apk
