name: Auto Setup & Build APK (Thermal Printer)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Auto Generate Project Files
        run: |
          echo "🚀 Inisialisasi React Native Project..."

          npm install react-native-document-picker@^9.0.1 react-native-pdf@6.7.4 react-native-blob-util@0.19.11 @react-native-async-storage/async-storage@^1.21.0 --save --legacy-peer-deps

          npx react-native@0.72.6 init AplikasiPrinter --version 0.72.6 --skip-install
          cd AplikasiPrinter
          npm install react-native-document-picker@^9.0.1 react-native-pdf@6.7.4 react-native-blob-util@0.19.11 @react-native-async-storage/async-storage@^1.21.0 --save --legacy-peer-deps

          cp ../App.js ./App.js

          sed -i 's/compileSdkVersion = 33/compileSdkVersion = 34/g' android/build.gradle
          sed -i 's/targetSdkVersion = 33/targetSdkVersion = 34/g' android/build.gradle
          sed -i 's/minSdkVersion = 21/minSdkVersion = 23/g' android/build.gradle

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.aplikasiprinter">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                android:name=".MainApplication"
                android:label="ThermalPrinter"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:allowBackup="false"
                android:theme="@style/AppTheme">
                <activity
                  android:name=".MainActivity"
                  android:label="ThermalPrinter"
                  android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                  android:launchMode="singleTask"
                  android:windowSoftInputMode="adjustResize"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
                </activity>
              </application>
          </manifest>
          EOF

          mkdir -p android/app/src/main/java/com/aplikasiprinter

          cat > android/app/src/main/java/com/aplikasiprinter/CustomPrinterModule.java <<'EOF'
          package com.aplikasiprinter;

          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Matrix;
          import android.graphics.pdf.PdfRenderer;
          import android.net.Uri;
          import android.os.ParcelFileDescriptor;
          import com.facebook.react.bridge.Arguments;
          import com.facebook.react.bridge.Promise;
          import com.facebook.react.bridge.ReactApplicationContext;
          import com.facebook.react.bridge.ReactContextBaseJavaModule;
          import com.facebook.react.bridge.ReactMethod;
          import com.facebook.react.bridge.WritableArray;
          import com.facebook.react.bridge.WritableMap;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.Set;
          import java.util.UUID;

          public class CustomPrinterModule extends ReactContextBaseJavaModule {
              private static final UUID SPP_UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");

              public CustomPrinterModule(ReactApplicationContext reactContext) {
                  super(reactContext);
              }

              @Override
              public String getName() {
                  return "CustomPrinter";
              }

              @ReactMethod
              public void getPairedDevices(Promise promise) {
                  try {
                      BluetoothAdapter adapter = BluetoothAdapter.getDefaultAdapter();
                      if (adapter == null) {
                          promise.reject("NO_BT", "Bluetooth tidak didukung di HP ini.");
                          return;
                      }

                      Set<BluetoothDevice> pairedDevices = adapter.getBondedDevices();
                      WritableArray deviceList = Arguments.createArray();

                      if (pairedDevices != null) {
                          for (BluetoothDevice device : pairedDevices) {
                              WritableMap map = Arguments.createMap();
                              map.putString("name", device.getName() != null ? device.getName() : "Unknown Printer");
                              map.putString("address", device.getAddress());
                              deviceList.pushMap(map);
                          }
                      }
                      promise.resolve(deviceList);
                  } catch (Exception e) {
                      promise.reject("SCAN_ERROR", e.getMessage());
                  }
              }

              @ReactMethod
              public void printPdfWithOptions(String uriString, String macAddress, int paperWidthMm, int rotationDegree, int copies, Promise promise) {
                  BluetoothSocket socket = null;
                  try {
                      Uri uri = Uri.parse(uriString);
                      InputStream inputStream = getReactApplicationContext().getContentResolver().openInputStream(uri);
                      File cacheFile = new File(getReactApplicationContext().getCacheDir(), "temp_print.pdf");
                      FileOutputStream fos = new FileOutputStream(cacheFile);
                      byte[] buffer = new byte[1024];
                      int read;
                      while ((read = inputStream.read(buffer)) != -1) {
                          fos.write(buffer, 0, read);
                      }
                      fos.close();
                      inputStream.close();

                      ParcelFileDescriptor pfd = ParcelFileDescriptor.open(cacheFile, ParcelFileDescriptor.MODE_READ_ONLY);
                      PdfRenderer renderer = new PdfRenderer(pfd);
                      PdfRenderer.Page page = renderer.openPage(0);

                      int printPixelWidth = paperWidthMm * 8;
                      if (printPixelWidth <= 0) printPixelWidth = 576; 

                      int height = (int) ((float) printPixelWidth / page.getWidth() * page.getHeight());

                      Bitmap originalBitmap = Bitmap.createBitmap(printPixelWidth, height, Bitmap.Config.ARGB_8888);
                      page.render(originalBitmap, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                      page.close();
                      renderer.close();
                      pfd.close();

                      Bitmap finalBitmap = originalBitmap;
                      if (rotationDegree != 0) {
                          Matrix matrix = new Matrix();
                          matrix.postRotate(rotationDegree);
                          finalBitmap = Bitmap.createBitmap(originalBitmap, 0, 0, originalBitmap.getWidth(), originalBitmap.getHeight(), matrix, true);
                      }

                      BluetoothAdapter adapter = BluetoothAdapter.getDefaultAdapter();
                      if (adapter == null || !adapter.isEnabled()) {
                          promise.reject("BT_OFF", "Bluetooth HP belum aktif.");
                          return;
                      }

                      BluetoothDevice device = adapter.getRemoteDevice(macAddress);
                      String deviceName = device.getName() != null ? device.getName().toUpperCase() : "";

                      socket = device.createRfcommSocketToServiceRecord(SPP_UUID);
                      socket.connect();

                      OutputStream os = socket.getOutputStream();

                      // DETEKSI AUTOMATIS NAMA PRINTER (TSPL / ESC-POS)
                      boolean isLabelPrinter = deviceName.contains("XP") || 
                                               deviceName.contains("420") || 
                                               deviceName.contains("LABEL") || 
                                               deviceName.contains("BARCODE") || 
                                               deviceName.contains("XPRINTER") || 
                                               deviceName.contains("TSC") ||
                                               deviceName.contains("POSTEK");

                      if (isLabelPrinter) {
                          // MODE TSPL (Xprinter XP-420B DLL)
                          int imgWidth = finalBitmap.getWidth();
                          int imgHeight = finalBitmap.getHeight();
                          int widthBytes = (imgWidth + 7) / 8;
                          int paperHeightMm = (int) ((float) imgHeight / 8);

                          for (int c = 0; c < copies; c++) {
                              String setupCmd = "SIZE " + paperWidthMm + " mm," + paperHeightMm + " mm\r\n"
                                      + "GAP 2 mm,0 mm\r\n"
                                      + "CLS\r\n"
                                      + "BITMAP 0,0," + widthBytes + "," + imgHeight + ",0,";
                              
                              os.write(setupCmd.getBytes("GBK"));
                              os.write(convertBitmapToTSPLData(finalBitmap));
                              os.write("\r\nPRINT 1,1\r\n".getBytes("GBK"));
                          }
                      } else {
                          // MODE ESC/POS (RPP02N / Printer Struk Kasir biasa)
                          for (int c = 0; c < copies; c++) {
                              os.write(new byte[]{0x1B, 0x40});
                              os.write(decodeBitmapToESCCommand(finalBitmap));
                              os.write(new byte[]{0x1D, 0x56, 0x41, 0x10});
                          }
                      }

                      os.flush();
                      socket.close();

                      promise.resolve("Cetak Sukses (" + (isLabelPrinter ? "Mode Label TSPL" : "Mode Struk ESC/POS") + ")!");
                  } catch (Exception e) {
                      if (socket != null) {
                          try { socket.close(); } catch (Exception ignored) {}
                      }
                      promise.reject("PRINT_ERROR", e.getMessage());
                  }
              }

              private byte[] convertBitmapToTSPLData(Bitmap bitmap) {
                  int width = bitmap.getWidth();
                  int height = bitmap.getHeight();
                  int widthBytes = (width + 7) / 8;
                  byte[] data = new byte[widthBytes * height];

                  int index = 0;
                  for (int y = 0; y < height; y++) {
                      for (int x = 0; x < widthBytes; x++) {
                          byte b = 0;
                          for (int bit = 0; bit < 8; bit++) {
                              int posX = x * 8 + bit;
                              if (posX < width) {
                                  int pixel = bitmap.getPixel(posX, y);
                                  int r = Color.red(pixel);
                                  int g = Color.green(pixel);
                                  int bVal = Color.blue(pixel);
                                  if ((r + g + bVal) / 3 >= 128) {
                                      b |= (1 << (7 - bit));
                                  }
                              } else {
                                  b |= (1 << (7 - bit));
                              }
                          }
                          data[index++] = b;
                      }
                  }
                  return data;
              }

              private byte[] decodeBitmapToESCCommand(Bitmap bmp) {
                  int width = bmp.getWidth();
                  int height = bmp.getHeight();
                  int bwWidth = (width + 7) / 8;
                  byte[] stream = new byte[(bwWidth + 8) * height + 8];

                  int k = 0;
                  stream[k++] = 0x1D;
                  stream[k++] = 0x76;
                  stream[k++] = 0x30;
                  stream[k++] = 0x00;
                  stream[k++] = (byte) (bwWidth % 256);
                  stream[k++] = (byte) (bwWidth / 256);
                  stream[k++] = (byte) (height % 256);
                  stream[k++] = (byte) (height / 256);

                  for (int i = 0; i < height; i++) {
                      for (int j = 0; j < bwWidth; j++) {
                          byte b = 0;
                          for (int p = 0; p < 8; p++) {
                              int posX = j * 8 + p;
                              if (posX < width) {
                                  int pixel = bmp.getPixel(posX, i);
                                  int r = Color.red(pixel);
                                  int g = Color.green(pixel);
                                  int bVal = Color.blue(pixel);
                                  if ((r + g + bVal) / 3 < 128) {
                                      b |= (byte) (128 >> p);
                                  }
                              }
                          }
                          stream[k++] = b;
                      }
                  }
                  return stream;
              }
          }
          EOF

          cat > android/app/src/main/java/com/aplikasiprinter/CustomPrinterPackage.java <<'EOF'
          package com.aplikasiprinter;

          import com.facebook.react.ReactPackage;
          import com.facebook.react.bridge.NativeModule;
          import com.facebook.react.bridge.ReactApplicationContext;
          import com.facebook.react.uimanager.ViewManager;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public class CustomPrinterPackage implements ReactPackage {
              @Override
              public List<NativeModule> createNativeModules(ReactApplicationContext reactContext) {
                  List<NativeModule> modules = new ArrayList<>();
                  modules.add(new CustomPrinterModule(reactContext));
                  return modules;
              }

              @Override
              public List<ViewManager> createViewManagers(ReactApplicationContext reactContext) {
                  return Collections.emptyList();
              }
          }
          EOF

          cat > android/app/src/main/java/com/aplikasiprinter/MainApplication.java <<'EOF'
          package com.aplikasiprinter;

          import android.app.Application;
          import com.facebook.react.PackageList;
          import com.facebook.react.ReactApplication;
          import com.facebook.react.ReactNativeHost;
          import com.facebook.react.ReactPackage;
          import com.facebook.soloader.SoLoader;
          import java.util.List;

          public class MainApplication extends Application implements ReactApplication {

            private final ReactNativeHost mReactNativeHost =
                new ReactNativeHost(this) {
                  @Override
                  public boolean getUseDeveloperSupport() {
                    return BuildConfig.DEBUG;
                  }

                  @Override
                  protected List<ReactPackage> getPackages() {
                    List<ReactPackage> packages = new PackageList(this).getPackages();
                    packages.add(new CustomPrinterPackage());
                    return packages;
                  }

                  @Override
                  protected String getJSMainModuleName() {
                    return "index";
                  }
                };

            @Override
            public ReactNativeHost getReactNativeHost() {
              return mReactNativeHost;
            }

            @Override
            public void onCreate() {
              super.onCreate();
              SoLoader.init(this, false);
            }
          }
          EOF

      - name: Build Android APK
        run: |
          cd AplikasiPrinter
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AplikasiPrinter-debug
          path: AplikasiPrinter/android/app/build/outputs/apk/debug/app-debug.apk
